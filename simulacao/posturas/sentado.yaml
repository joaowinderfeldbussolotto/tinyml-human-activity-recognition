# Valores fixos: média da aceleração das janelas de demonstração de 'sentado' (giroscópio em 0).
name: sentado
version: 1
steps:
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.98
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.15
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.11
  - wait-serial: 'MODO LIVE'
  - wait-serial: '(prob'
  - delay: 3500ms
