# Valores fixos: média da aceleração das janelas de demonstração de 'em_pe' (giroscópio em 0).
name: em_pe
version: 1
steps:
  - set-control:
      part-id: imu1
      control: accelX
      value: 1.01
  - set-control:
      part-id: imu1
      control: accelY
      value: -0.17
  - set-control:
      part-id: imu1
      control: accelZ
      value: -0.01
  - wait-serial: 'MODO LIVE'
  - wait-serial: '(prob'
  - delay: 3500ms
